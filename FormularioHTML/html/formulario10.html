<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="procesar_formulario.php" method="get">
        <label for="genero">Seleccione su género:</label>
        <select id="genero" name="genero" required>
            <option value="">-- Seleccione --</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
            <option value="therian">Therian</option>
            <option value="otro">Otro</option>
        </select>
        <br>
        <label for="question"> ¿Es usted homosexual? </label>
        <input type="radio" id="question1" name="question" value="si" required>
        <label for="question1">Sí</label>
        <input type="radio" id="question2" name="question" value="no" required>
        <label for="question2">No</label>
        <br>

        <label for="nombre">Ingrese su nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <label for="fecha">Seleccione su cumpleaños:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br>

        <label for="email">Ingrese su email:</label>
        <input type="email" id="email" name="email" required>

        <br>
        <label for="question2">¿Cual de estos objetos eligirias para llevar a un paseo ?  </label>
        <input type="radio" id="question3" name="question2" value="cuchillo" required>
        <label for="question3">Cuchillo</label>
        <input type="radio" id="question4" name="question2" value="pistola" required>
        <label for="question4">Pistola</label>
        <input type="radio" id="question5" name="question2" value="cuerda" required>
        <label for="question5">Cuerda</label>
        <br>

        <input type="submit" value="Enviar">

    </form>
</body>
</html>
