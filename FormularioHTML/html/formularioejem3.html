<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de formulario</title>
</head>

<body>

    <form action="" method="get">

       
        <p>
            <input type="button" value="Click me" onclick="alert('Boton presionado')">
        </p>


        <p>
            <input type="checkbox" name="check1" value="valor1">
            Descansito
        </p>

        <p>
            <input type="checkbox" name="check2" value="valor2">
            Eso es todo
        </p>


        <p>
            <strong>RADIO</strong>
        </p>

        <p>
            <input type="radio" name="super_descansito" value="hola mundo">
            Opción 1
        </p>

        <p>
            <input type="radio" name="super_descansito" value="hola mundo2">
            Opción 2
        </p>

        <p>
            <input type="radio" name="super_descansito" value="hola mundo3">
            Opción 3
        </p>

        <p>
            <input type="radio" name="super_descansito" value="hola mundo4">
            Opción 4
        </p>

    </form>

</body>

</html>
